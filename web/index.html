<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Nightfall</title>
    <style>
      html,
      body,
      canvas {
        position: absolute;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0e0b1a;
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="0" aria-label="Nightfall game"></canvas>
    <script src="miniquad.js"></script>
    <script>
      (() => {
        // Miniquad 0.4.11 caches Rust's DPI at startup. Keep canvas resizing and
        // pointer coordinates at that same density after browser zoom changes.
        const runtimeDpiScale = dpi_scale;
        let sessionDpi;
        dpi_scale = () => {
          if (!high_dpi) return 1;
          sessionDpi ??= runtimeDpiScale();
          return sessionDpi;
        };
        // The runtime constructed its WASM import table before this wrapper.
        importObject.env.dpi_scale = dpi_scale;
        load("nightfall.wasm");
      })();
    </script>
  </body>
</html>
