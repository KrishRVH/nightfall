[package]
name = "nightfall"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A polished, asset-free Vampire Survivors-style Macroquad teaching game."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/KrishRVH/nightfall"
publish = false

[dependencies]
macroquad = { version = "0.4.16", default-features = false }

# Practical strict-by-default linting baseline.
[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
unexpected_cfgs = "deny"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.rustdoc]
all = { level = "warn", priority = -1 }
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Rendering coordinates and bounded collection indices deliberately use f32;
# float-to-integer casts also saturate damage displays and elapsed-time labels.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

allow_attributes_without_reason = "warn"
dbg_macro = "deny"
expect_used = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"
wildcard_dependencies = "deny"

# Use const for constructors and model data; presentation helpers need not be
# compile-time functions just because their current implementation permits it.
missing_const_for_fn = "allow"

# `unreachable_pub` requires crate visibility where this Clippy lint prefers `pub`.
redundant_pub_crate = "allow"

# Coordinate arithmetic is clearer here than pervasive `mul_add` calls.
suboptimal_flops = "allow"
