# Macroquad's WebGL symbols are supplied by the locked Miniquad package's
# runtime, copied to target/web/miniquad.js by `mise run rust:web:build`.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=--allow-undefined"]

# Nightfall is a game, so the Windows build links as a GUI application and opens
# no console window.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--subsystem,windows"]
